name: Conformance

# Every load-bearing fact Pitboard has about a tool was read out of one build of it, and
# Claude Code and Codex each ship several times a week. This fetches the newest build of
# each and checks that the facts can still be read from it, each against its own register.
#
# It is shallow on purpose: a literal being present does not prove the behaviour around it
# is unchanged. A literal disappearing does prove something moved, which is the only thing
# worth an issue.
#
# Claude Code's macOS and Linux builds carry different code, and the Linux one has no
# keychain code at all, so both are checked, each for the facts read from it. Checking the
# Linux build alone reported the keychain gone on every build from 2.1.278 and missed the
# one real change, in 2.1.281, which only the macOS build shows. Its Windows builds, x64 and
# ARM64, carry code of their own again, and so do Codex's, so every build of each tool is
# checked for the facts its register's table reads on that system.

on:
  schedule:
    # Twice a week, a few hours apart from the Sparkle check so two failures do not arrive
    # together.
    - cron: "17 6 * * 1,4"
  workflow_dispatch:
    inputs:
      version:
        description: Which Claude Code to check, or blank for the newest
        required: false
      codex_version:
        description: Which Codex to check, or blank for the newest
        required: false

permissions:
  contents: read

jobs:
  probe:
    # Reading a build is reading its bytes, so every one is read on Linux, and none is run.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [linux-x64, darwin-arm64, win32-x64, win32-arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Fetch the Claude Code to check
        id: fetch
        run: |
          version="${{ inputs.version }}"
          if [ -z "$version" ]; then
            version=$(npm view @anthropic-ai/claude-code version)
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # The wrapper on npm carries no code; the native build is its own package. The
          # binary is found by its name, `claude` or `claude.exe`: nothing says a Windows
          # build keeps an execute bit.
          npm pack "@anthropic-ai/claude-code-${{ matrix.platform }}@$version" --silent
          tar xzf ./*.tgz
          binary=$(find package -type f \( -name claude -o -name claude.exe \) | head -1)
          test -n "$binary" || { echo "no binary in the package"; exit 1; }
          echo "binary=$binary" >> "$GITHUB_OUTPUT"

      - name: Read Pitboard's facts out of it
        id: probe
        run: |
          cargo run --locked --release -p pitboard-conformance -- \
            "${{ steps.fetch.outputs.binary }}" | tee report.txt
          cargo run --locked --release -p pitboard-conformance -- \
            "${{ steps.fetch.outputs.binary }}" --json > report.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: conformance-${{ steps.fetch.outputs.version }}-${{ matrix.platform }}
          path: |
            report.txt
            report.json

  codex:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [linux-x64, darwin-arm64, win32-x64, win32-arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Fetch the Codex to check
        id: fetch
        run: |
          version="${{ inputs.codex_version }}"
          if [ -z "$version" ]; then
            version=$(npm view @openai/codex version)
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # The wrapper on npm carries no binary; each platform's is a tagged version of it,
          # whose `vendor/` holds `codex`, or `codex.exe` beside Codex's other Windows
          # programs.
          npm pack "@openai/codex@$version-${{ matrix.platform }}" --silent
          tar xzf ./*.tgz
          binary=$(find package/vendor -type f \( -name codex -o -name codex.exe \) | head -1)
          test -n "$binary" || { echo "no binary in the package"; exit 1; }
          echo "binary=$binary" >> "$GITHUB_OUTPUT"

      - name: Read Pitboard's facts out of it
        run: |
          cargo run --locked --release -p pitboard-conformance -- \
            "${{ steps.fetch.outputs.binary }}" --provider codex | tee report.txt
          cargo run --locked --release -p pitboard-conformance -- \
            "${{ steps.fetch.outputs.binary }}" --provider codex --json > report.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: conformance-codex-${{ steps.fetch.outputs.version }}-${{ matrix.platform }}
          path: |
            report.txt
            report.json
