name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo fmt --check

  clippy:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --all-targets --locked
      # The fixtures, which only a build with the feature compiles.
      - run: cargo clippy -p pitboard-ffi --all-targets --locked --features fixture

  test:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --locked -- --skip writing_preserves_attributes
      # The fixtures, each a world on the real core, which only a build with the feature has.
      - run: cargo test --locked -p pitboard-ffi --features fixture
      # Asserts a read-latency threshold that concurrent `security` calls can breach, so it
      # runs alone. It exists only on macOS.
      - if: runner.os == 'macOS'
        run: cargo test --locked -p pitboard --test keychain_write_is_harmless writing_preserves_attributes

  apple:
    runs-on: macos-latest
    # A test waiting on a stand-in sign-in that never answers ignores its own time limit, and
    # a stuck job otherwise holds a runner for six hours.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # PitboardBindings and PitboardShareBindings are generated, so only what is written by
      # hand is checked.
      - run: >
          swift format lint --strict --recursive --configuration apps/macos/.swift-format
          apps/macos/Sources/PitboardApp apps/macos/Sources/PitboardKit apps/macos/Sources/PitboardLinkTarget
          apps/macos/App apps/macos/ShareExtension apps/macos/UITests apps/macos/Tests apps/macos/scripts
          .github/scripts
      - uses: ./.github/actions/xcodegen
      # Proves the core still links into the app, that its bindings still match, and that
      # the bundle still assembles and signs.
      - run: ./apps/macos/scripts/build-app.sh
      # The command line the app comes with is what its renewal schedule runs and what the
      # cask puts on PATH, so it is run from inside the bundle, checked for both
      # architectures, and the bundle verified with it in place.
      - run: |
          helper=apps/macos/build/Pitboard.app/Contents/Helpers/pitboard
          "$helper" --version
          for arch in arm64 x86_64; do lipo "$helper" -verify_arch "$arch"; done
          codesign --verify --strict --deep apps/macos/build/Pitboard.app
      # The core again, with its fixtures: the worlds the debug build and the UI tests
      # launch into, and the one the package's tests start a model in, are Rust's, and only
      # a library built so has them. Their bindings are the same either way. Only after the
      # release is built and checked above, since this empties apps/macos/build, and
      # build-app.sh never passes it.
      - run: ./apps/macos/scripts/build-xcframework.sh --fixture
      - run: swift test --package-path apps/macos
      # The app driven the way a person drives it: the debug build, started by each test in
      # a fixture rather than on this runner's own accounts. A UI test needs Automation Mode,
      # which asks for a password unless the machine allows it without one. GitHub's macOS
      # images are built to allow it and check that they do, and a runner that did not
      # would hang until the test timed out, so that is said first and plainly.
      - id: ui
        run: |
          mode=$(automationmodetool)
          echo "$mode"
          case "$mode" in
            *"DOES NOT REQUIRE"*) ;;
            *) echo "this runner asks for a password before UI tests can run" >&2; exit 1 ;;
          esac
          xcodebuild test -project apps/macos/Pitboard.xcodeproj -scheme Pitboard \
            -destination 'platform=macOS' -derivedDataPath apps/macos/build/UITestData \
            -clonedSourcePackagesDirPath apps/macos/build/SourcePackages \
            -resultBundlePath "$RUNNER_TEMP/UITests.xcresult"
      # The result bundle has what the log cannot: a screenshot and the tree of elements at
      # the moment a test failed. Nobody needs it when they all pass.
      - if: failure() && steps.ui.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: UITests.xcresult
          path: ${{ runner.temp }}/UITests.xcresult

  # The floor the manifests promise, built the way someone on an older toolchain builds it.
  csharp:
    # The Windows app reaches the core through these bindings. They are generated from the
    # core, compiled and called on every change, so a change C# cannot express, or bindings
    # that no longer match the library, fail here rather than in the app.
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: apps/windows/global.json
      - run: cargo build --locked --release -p pitboard-ffi
      # Read from the static library: the release profile strips the shared one, and with
      # it the metadata the generator reads, which it answers by writing nothing at all.
      - run: |
          mkdir -p apps/windows/Pitboard.Core/Generated
          cargo run --locked --release -p uniffi-bindgen-csharp -- \
            --library target/release/libpitboard_ffi.a \
            --out-dir apps/windows/Pitboard.Core/Generated \
            --config crates/pitboard-ffi/uniffi.toml --no-format
          test -s apps/windows/Pitboard.Core/Generated/pitboard_ffi.cs
      # global.json, which pins the SDK and the test platform, is read from where dotnet runs.
      # The test of a fixture's model is skipped here, against a library with no fixtures.
      - working-directory: apps/windows
        run: >
          dotnet test --solution Pitboard.slnx
          -p:PitboardNativeLibrary="$GITHUB_WORKSPACE/target/release/libpitboard_ffi.so"
      # The same library with its fixtures, which a debug build of either app launches into.
      # Its bindings must be the very ones generated without them, which is what lets one
      # set serve both, and the library without them must hold none of a fixture's text.
      - run: |
          if LC_ALL=C grep -a -q -e 'A Pitboard fixture page' -e 'dana@work.example' \
            target/release/libpitboard_ffi.so; then
            echo "a library built without the fixture feature holds a fixture" >&2
            exit 1
          fi
          cargo build --locked --release -p pitboard-ffi --features fixture
          mkdir -p "$RUNNER_TEMP/fixture-bindings"
          cargo run --locked --release -p uniffi-bindgen-csharp -- \
            --library target/release/libpitboard_ffi.a \
            --out-dir "$RUNNER_TEMP/fixture-bindings" \
            --config crates/pitboard-ffi/uniffi.toml --no-format
          cmp apps/windows/Pitboard.Core/Generated/pitboard_ffi.cs \
            "$RUNNER_TEMP/fixture-bindings/pitboard_ffi.cs"
      # Here the fixture's model is started, and tells a listener written in C# of its
      # accounts from a thread of its own.
      - working-directory: apps/windows
        run: >
          dotnet test --solution Pitboard.slnx
          -p:PitboardNativeLibrary="$GITHUB_WORKSPACE/target/release/libpitboard_ffi.so"

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          floor=$(sed -n '/^\[workspace.package\]/,/^\[/s/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          rustup toolchain install "$floor" --profile minimal
          echo "FLOOR=$floor" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo "+$FLOOR" check --workspace --all-targets --locked
      # The fixtures, which only a build with the feature compiles.
      - run: cargo "+$FLOOR" check -p pitboard-ffi --all-targets --locked --features fixture

  semver:
    # What a published version promises, checked against the published version. It reports
    # and does not block: the crate is the binary's engine before it is anyone's library,
    # and a first run on a young crate finds things worth reading rather than obeying.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-semver-checks
      - run: cargo semver-checks --package pitboard-core

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  # The update key rehearsal ships bundles that really do update themselves, so it must
  # never be able to reach the real key, the real certificate or the real feed. A job that
  # never asks for a repository secret cannot be handed one, and that is worth knowing on
  # the pull request that changes it rather than the month after.
  rehearsal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          if grep -q 'secrets\.' .github/workflows/rotation.yml; then
            echo "the rehearsal asks for a repository secret, so it can be given one" >&2
            exit 1
          fi
