name: Sparkle

# Sparkle is the code that installs updates on someone else's machine, so a move has to be
# noticed. apps/macos/project.yml pins it, and Package.resolved pins its revision, and
# Dependabot reads neither: XcodeGen's spec is not a format it knows, and in apps/macos/ it
# reads Package.swift, whose XCFramework is built rather than committed, so resolution
# fails.
on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  behind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          resolved=apps/macos/Pitboard.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          pinned=$(python3 -c "import json,sys;print([p for p in json.load(open(sys.argv[1]))['pins'] if p['identity']=='sparkle'][0]['state']['version'])" "$resolved")
          latest=$(gh api repos/sparkle-project/Sparkle/releases/latest --jq .tag_name)
          echo "pinned $pinned, latest $latest"
          [ "$pinned" = "$latest" ] && exit 0
          title="Sparkle $latest is out (we pin $pinned)"
          if [ -n "$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number --jq '.[0].number')" ]; then
            echo "already open"
            exit 0
          fi
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body \
            "$resolved pins Sparkle $pinned; $latest is released. Raise Sparkle's \`exactVersion\` in apps/macos/project.yml to $latest. Run ./apps/macos/scripts/build-xcframework.sh first: the project cannot resolve its packages without the XCFrameworks and the bindings it builds. Then run \`xcodegen generate --spec apps/macos/project.yml\` and \`xcodebuild -resolvePackageDependencies -project apps/macos/Pitboard.xcodeproj\`, which writes the new revision into Package.resolved, and commit both files. Then run apps/macos/scripts/build-app.sh and check the app still updates itself."
