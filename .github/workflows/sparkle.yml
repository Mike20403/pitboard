name: Sparkle

# Sparkle is the code that installs updates on someone else's machine, so a move has to be
# noticed. Pitboard.xcodeproj pins it, and Dependabot is not set up to read that: in apple/
# it reads Package.swift before any Xcode project, and that manifest names an XCFramework
# that is built rather than committed, so resolution fails.
on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  behind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          resolved=apple/Pitboard.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          pinned=$(python3 -c "import json,sys;print([p for p in json.load(open(sys.argv[1]))['pins'] if p['identity']=='sparkle'][0]['state']['version'])" "$resolved")
          latest=$(gh api repos/sparkle-project/Sparkle/releases/latest --jq .tag_name)
          echo "pinned $pinned, latest $latest"
          [ "$pinned" = "$latest" ] && exit 0
          title="Sparkle $latest is out (we pin $pinned)"
          if [ -n "$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number --jq '.[0].number')" ]; then
            echo "already open"
            exit 0
          fi
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body \
            "$resolved pins Sparkle $pinned; $latest is released. Run ./apple/scripts/build-xcframework.sh first: the project cannot resolve its packages without the XCFramework and the bindings it builds. Then bump Sparkle in Xcode with File, Packages, Update to Latest Package Versions, or raise the Sparkle requirement in apple/Pitboard.xcodeproj/project.pbxproj and run \`xcodebuild -resolvePackageDependencies -project apple/Pitboard.xcodeproj\`. Then run apple/scripts/build-app.sh and check the app still updates itself."
