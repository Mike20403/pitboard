[package]
name = "pitboard"
description = "Park and restore your own Claude Code and Codex logins on one machine, and see what each one has left."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["cli", "keychain", "credentials", "macos", "linux"]
categories = ["command-line-utilities"]

# cargo-binstall fetches the release the workflow already builds instead of compiling the
# tree, which is minutes of work for someone who only wants the binary.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }.tar.gz"
pkg-fmt = "tgz"
bin-dir = "{ name }-v{ version }-{ target }/{ bin }{ binary-ext }"
# quick-install serves a third party's build, which a tool holding OAuth logins should not
# install, and reports every install to a stats server.
disabled-strategies = ["quick-install"]

# No release before 1.0 carries a Windows archive, and a Windows build of one refuses
# everything (pitboard-core's release gate). So on Windows binstall finds no archive and stops,
# rather than compile that build from source. Read from cargo-binstall 1.25.2's binstalk-types
# 0.10.8: an override is keyed by target triple, may name disabled-strategies, and adds them
# to the package's own. A binstall that does not read them compiles the build that refuses.
[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
disabled-strategies = ["quick-install", "compile"]

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
disabled-strategies = ["quick-install", "compile"]

[dependencies]
pitboard-core.workspace = true
anstream.workspace = true
anstyle.workspace = true
clap.workspace = true
clap_complete.workspace = true
clap_mangen.workspace = true
roff.workspace = true
serde.workspace = true
serde_json.workspace = true
unicode-width.workspace = true

[dev-dependencies]
pitboard-core = { workspace = true, features = ["test-support"] }
insta.workspace = true
mockito.workspace = true

[lints]
workspace = true
