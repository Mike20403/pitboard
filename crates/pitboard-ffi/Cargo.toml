[package]
name = "pitboard-ffi"
description = "Pitboard's core as generated bindings for its native apps."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
# A static library for the macOS app, a dynamic one for the Windows app to load.
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
pitboard-core.workspace = true
pitboard-sites.workspace = true
sha1.workspace = true
thiserror.workspace = true
uniffi.workspace = true
unicode-normalization.workspace = true
unicode-segmentation.workspace = true

[dev-dependencies]
# The core's machine in memory and its scripted services, which the model's tests run the
# real core on. Tests alone: the libraries the apps link are built without them.
pitboard-core = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
